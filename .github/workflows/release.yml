name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build universal app and DMG
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh --dmg
      - name: Zip
        run: cd build && ditto -c -k --keepParent Kumquat.app "Kumquat-${GITHUB_REF_NAME#v}.zip"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Kumquat ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" build/*.dmg build/*.zip --clobber
